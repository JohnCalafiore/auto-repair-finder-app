name: Import state licensing

on:
  workflow_dispatch:
  schedule:
    # Quarterly, after the monthly Overture ingest has refreshed shops
    - cron: '0 7 2 1,4,7,10 *'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get install -y -q postgresql-client
          # Supabase's direct DB hostname is IPv6-only and GitHub runners have
          # no IPv6 — fall back to the IPv4 session pooler when direct fails.
          DB_URL="$SUPABASE_DB_URL"
          case "$DB_URL" in *"[YOUR-PASSWORD]"*|*"[your-password]"*)
            echo "::error::SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder — replace it with the real database password (Supabase → Connect, or reset it under Settings → Database)."
            exit 1;;
          esac
          if ! timeout 15 psql "$DB_URL" -c 'select 1' >/dev/null 2>&1; then
            echo "Direct connection unreachable; switching to session pooler"
            PASS="${DB_URL#*://postgres:}"; PASS="${PASS%%@*}"
            DB_URL="postgresql://postgres.hinzrkaoayxdbhmjlgvk:${PASS}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
            timeout 15 psql "$DB_URL" -c 'select 1' >/dev/null
          fi
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Download NY DMV repair shop registry
        run: |
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) TrueWrench-ingest" -o ny_registry.csv \
            "https://data.ny.gov/api/views/icjc-x44x/rows.csv?accessType=DOWNLOAD"
          head -1 ny_registry.csv
          wc -l ny_registry.csv

      - name: Match NY registry
        run: |
          psql "$DB_URL" -c "\copy (select id, name, address from public.shops where address like '%, NY, %') to 'shops_ny.csv' with (format csv, header true)"
          wc -l shops_ny.csv
          python scripts/import_licensing.py --registry ny_registry.csv --shops shops_ny.csv --out matches_ny.csv

      - name: Match CA registry (drop-in file, see data/licensing/README.md)
        run: |
          if [ -f data/licensing/ca_registry.csv ]; then
            psql "$DB_URL" -c "\copy (select id, name, address from public.shops where address like '%, CA, %') to 'shops_ca.csv' with (format csv, header true)"
            wc -l shops_ca.csv
            python scripts/import_licensing.py --registry data/licensing/ca_registry.csv --shops shops_ca.csv --out matches_ca.csv
          else
            echo "No CA registry file present — skipping (see data/licensing/README.md to add it)."
          fi

      - name: Upsert trust signals
        run: |
          head -q -n 1 matches_*.csv | head -1 > matches.csv
          tail -q -n +2 matches_*.csv >> matches.csv
          wc -l matches.csv
          psql "$DB_URL" <<'SQL'
          create temp table licensing_staging (shop_id text, state_licensed boolean);
          \copy licensing_staging from 'matches.csv' with (format csv, header true)
          insert into public.trust_signals (shop_id, state_licensed)
          select distinct shop_id, state_licensed from licensing_staging
          on conflict (shop_id) do update set
            state_licensed = excluded.state_licensed,
            updated_at = now();
          select count(*) filter (where state_licensed) as licensed_shops from public.trust_signals;
          SQL
