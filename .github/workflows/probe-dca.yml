# TEMPORARY probe — removed once the CA download URL is confirmed.
name: Probe DCA licensee lists (temporary)

on:
  push:
    branches: [claude/auto-repair-shop-search-clee0o]
    paths: ['.github/workflows/probe-dca.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AutomotiveRepair_Data00.xls
        run: |
          pip install --quiet xlrd openpyxl pandas
          python3 - <<'EOF'
          import json, urllib.request

          def get(url, tok=None, raw=False):
              h = {"User-Agent": "Mozilla/5.0"}
              if tok:
                  h["Authorization"] = "Bearer " + tok
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read() if raw else json.load(r)

          tok = get("https://www.dca.ca.gov/boxToken/getToken", raw=True).decode().strip().strip('"')
          data = get("https://api.box.com/2.0/files/2383114823828/content", tok, raw=True)
          print("bytes:", len(data))
          print("magic:", data[:16])

          open("data00.xls", "wb").write(data)
          if data[:8] == b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1":
              import pandas as pd
              df = pd.read_excel("data00.xls")
              print("SHEET rows:", len(df))
              print("columns:", list(df.columns))
              print(df.head(3).to_string())
              # distribution of license type + status columns if present
              for c in df.columns:
                  lc = str(c).lower()
                  if "type" in lc or "status" in lc:
                      print(f"-- {c} --")
                      print(df[c].value_counts().head(12).to_string())
          else:
              text = data[:5000].decode("utf-8", "replace")
              print(repr(text[:2000]))
          EOF
