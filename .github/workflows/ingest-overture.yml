name: Ingest Overture shops

on:
  workflow_dispatch:
    inputs:
      release:
        description: Overture release (e.g. 2026-07-22.0)
        required: false
        default: 2026-07-22.0
  schedule:
    # Monthly, a week after Overture's usual release cadence
    - cron: '0 6 1 * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install duckdb
          sudo apt-get install -y -q postgresql-client

      - name: Resolve database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Supabase's direct DB hostname is IPv6-only and GitHub runners have
          # no IPv6 — fall back to the IPv4 session pooler when direct fails.
          DB_URL="$SUPABASE_DB_URL"
          case "$DB_URL" in *"[YOUR-PASSWORD]"*|*"[your-password]"*)
            echo "::error::SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder — replace it with the real database password (Supabase → Connect, or reset it under Settings → Database)."
            exit 1;;
          esac
          if ! timeout 15 psql "$DB_URL" -c 'select 1' >/dev/null 2>&1; then
            echo "Direct connection unreachable; switching to session pooler"
            PASS="${DB_URL#*://postgres:}"; PASS="${PASS%%@*}"
            DB_URL="postgresql://postgres.hinzrkaoayxdbhmjlgvk:${PASS}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
            timeout 15 psql "$DB_URL" -c 'select 1' >/dev/null
          fi
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Extract US auto-repair places from Overture
        run: python scripts/ingest_overture.py --release "${{ github.event.inputs.release || '2026-07-22.0' }}" --out shops.csv

      - name: Load into Supabase
        run: |
          psql "$DB_URL" <<'SQL'
          create temp table shops_staging (
            id text, name text, categories text[], address text, phone text,
            website text, lat double precision, lng double precision, specialties text[]
          );
          \copy shops_staging from 'shops.csv' with (format csv, header true, null '')
          insert into public.shops (id, name, categories, address, phone, website, lat, lng, specialties)
          select id, name, coalesce(categories, '{general}'), coalesce(address, ''), coalesce(phone, ''),
                 website, lat, lng, specialties
          from shops_staging
          on conflict (id) do update set
            name = excluded.name, categories = excluded.categories, address = excluded.address,
            phone = excluded.phone, website = excluded.website, lat = excluded.lat,
            lng = excluded.lng, specialties = excluded.specialties, updated_at = now();
          select count(*) as total_shops from public.shops;
          SQL
