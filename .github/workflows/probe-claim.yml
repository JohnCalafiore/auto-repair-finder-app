# TEMPORARY — submits one test claim against production and is removed
# right after. The dev sandbox cannot reach *.vercel.app directly.
name: Probe claim endpoint (temporary)

on:
  push:
    branches: [claude/auto-repair-shop-search-clee0o]
    paths: ['.github/workflows/probe-claim.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production to serve /api/claim, then POST one test claim
        run: |
          # Endpoint exists once GET returns 405 (Method not allowed) instead of 404.
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://truewrench.vercel.app/api/claim)
            echo "attempt $i: GET /api/claim -> $code"
            [ "$code" = "405" ] && break
            sleep 10
          done
          [ "$code" = "405" ] || { echo "::error::endpoint never appeared"; exit 1; }

          echo "== demo id must be rejected =="
          curl -s -w '\nHTTP %{http_code}\n' -X POST https://truewrench.vercel.app/api/claim \
            -H 'Content-Type: application/json' \
            -d '{"shopId":"liberty-auto-care","businessName":"x","contactName":"y","email":"a@b.co"}'

          echo "== real Denver shop: Goodyear Auto Service Center, 1460 Tremont Pl =="
          curl -s -w '\nHTTP %{http_code}\n' -X POST https://truewrench.vercel.app/api/claim \
            -H 'Content-Type: application/json' \
            -d '{"shopId":"89e3eda6-cd5a-4b97-95a9-ac2aa196199c","businessName":"Goodyear Auto Service Center","contactName":"TrueWrench test claim","email":"test-claim@truewrench.invalid","phone":"","message":"Automated production verification of the claim flow (PR #18). Safe to delete."}'
